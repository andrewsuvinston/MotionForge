<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Binary bits — approved example</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #0B1220;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #F8FAFC;
  }
  #stage {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 5vmin; padding: 8vmin;
  }
  h1 { font-size: 7vmin; font-weight: 700; letter-spacing: -0.02em; text-align: center; }
  h1 .accent { color: #22D3EE; }
  .bits { display: flex; gap: 2vmin; }
  .bit {
    width: 9vmin; height: 12vmin;
    display: flex; align-items: center; justify-content: center;
    font-family: Consolas, "Courier New", monospace;
    font-size: 6.5vmin; font-weight: 700;
    border-radius: 1.6vmin;
    background: #16213A;
    border: 0.35vmin solid #22D3EE;
    color: #22D3EE;
  }
  .bit.zero { border-color: #334155; color: #94A3B8; }
  .value { font-size: 5vmin; color: #CBD5E1; }
  .value b { color: #F59E0B; font-family: Consolas, monospace; }
  .caption { font-size: 3.4vmin; color: #94A3B8; text-align: center; }
</style>
</head>
<body>
<div id="stage">
  <h1>Eight bits, <span class="accent">one number</span></h1>
  <div class="bits" id="bits">
    <div class="bit">1</div><div class="bit zero">0</div><div class="bit">1</div><div class="bit">1</div>
    <div class="bit zero">0</div><div class="bit">1</div><div class="bit zero">0</div><div class="bit">1</div>
  </div>
  <div class="value">= <b id="num">0</b> in decimal</div>
  <div class="caption">Each position doubles: 128 · 64 · 32 · 16 · 8 · 4 · 2 · 1</div>
</div>
<script>
  window.SCENE_DURATION = 5.0;
  window.setTime = function (t) {
    const stage = document.getElementById("stage");
    stage.style.opacity = String(MF.envelope(t, SCENE_DURATION));
    MF.reveal(document.querySelector("h1"), t, 0.15, 0.6, { dy: 50 });
    MF.stagger(document.querySelectorAll(".bit"), t, 0.8, 0.12, 0.45, { dy: 0, scale: 0.6, ease: "outBack" });
    MF.reveal(document.querySelector(".value"), t, 2.1, 0.5, { dy: 30 });
    MF.counter(document.getElementById("num"), t, 2.2, 1.3, 0, 181);
    MF.reveal(document.querySelector(".caption"), t, 2.8, 0.6, { dy: 24 });
  };
  setTime(0);
</script>
</body>
</html>
