# MotionForge — Shorts production studio configuration
models:
  generator_model: anthropic/claude-sonnet-5.5      # paid: high-value steps only
  reviewer_model: nvidia/nemotron-3.5-super-vl:free # vision judge
  fallback_model: qwen/qwen4-max                    # paid fallback
  free_model: nvidia/nemotron-3.5-lightning:free    # last resort / cheap tier
  cheap_model: nvidia/nemotron-3.5-lightning:free   # formatting, metadata, judges

llm:
  base_url: https://openrouter.ai/api/v1
  max_retries: 2
  timeout_seconds: 240
  max_tokens: 6000
  temperature: 0.7

budget:
  daily_request_limit: 50      # free-tier daily free-model requests
  max_requests_per_run: 24
  max_cost_usd: 0.10
  cache_enabled: true

quality:
  default: preview
  preview: {width: 540, height: 960, fps: 15}
  final:   {width: 1080, height: 1920, fps: 30}
  gate:
    min_judge: 7.0             # every judge score must be >= this
    min_hook: 8.0              # hook must be >= this
    max_rounds: 5
    min_improvement: 0.3       # stop if two rounds improve less than this

video:
  safe_top: 0.08               # 8% top safe area (YouTube UI)
  safe_bottom: 0.15            # 15% bottom safe area
  min_occupancy: 0.55          # visible content must span >= 55% of frame height
  headline_px: 92              # at 1080 width
  body_px: 56
  min_font_px: 50
  max_words_scene: 10
  wps: 2.5                     # narration words per second budget
  max_sentence_words: 14
  pace_change_seconds: 2.5     # something must change at least this often
  fps: 30
  preview_fps: 15

audio:
  tts_enabled: true
  tts_voice: en-US-GuyNeural
  tts_rate: "+8%"
  target_lufs: -14
  music_volume: 0.18
  sfx_volume: 0.5
  sfx_enabled: true

judges:
  vision_model: nvidia/nemotron-3.5-super-vl:free
  text_model: nvidia/nemotron-3.5-lightning:free
  frames_per_round: 12
  enabled: true

checks:
  min_font_ratio: 0.045        # min font = min(vw,vh) * ratio (>= 48px at 1080)
  min_contrast_large: 3.0
  min_contrast_small: 4.5
  overlap_threshold: 0.2
  blank_stddev: 2.0
  blank_max_colors: 8
  edge_tolerance_px: 4

loop:
  max_iterations: 3            # per-scene legacy repair budget (new pipeline)
  sample_fractions: [0.02, 0.25, 0.5, 0.75, 0.98]
  vision_review: false

memory:
  top_lessons: 8
  max_approved_examples: 2
  prune_after_seen: 6
  topic_history_limit: 10

series:
  default_ratio: "9:16"
  default_duration: 35
  default_quality: preview
