# MotionForge configuration
models:
  generator_model: anthropic/claude-sonnet-5.5
  reviewer_model: nvidia/nemotron-3.5-super-vl:free   # vision model, reviews frames
  # NOTE: "qwen/qwen4-max:free" does not exist on OpenRouter; the plain id does.
  # The LLM client also auto-resolves invalid ids against the live model list.
  fallback_model: qwen/qwen4-max
  # Last resort when paid models fail (e.g. free-tier accounts with no credits).
  free_model: nvidia/nemotron-3.5-lightning:free

llm:
  base_url: https://openrouter.ai/api/v1
  max_retries: 3          # attempts per model before falling back
  timeout_seconds: 300
  max_tokens: 8000
  temperature: 0.7

render:
  fps: 30
  preview_fps: 15
  resolutions:
    "16:9": [1920, 1080]
    "9:16": [1080, 1920]
    "1:1": [1080, 1080]

loop:
  max_iterations: 4       # max generate/fix iterations per scene
  sample_fractions: [0.02, 0.25, 0.5, 0.75, 0.98]
  vision_review: true     # set false (or --no-review) to skip the vision model

checks:
  min_font_ratio: 0.022   # min font px = min(width,height) * ratio
  min_contrast_large: 3.0 # WCAG ratio for large text (>=24px bold / >=32px)
  min_contrast_small: 4.5
  overlap_threshold: 0.2  # intersection / smaller area
  blank_stddev: 2.0       # grayscale stddev below this + few colors = blank
  blank_max_colors: 8
  edge_tolerance_px: 4

memory:
  top_lessons: 8
  max_approved_examples: 2
  prune_after_seen: 6     # prune lessons seen >= N times that never helped
